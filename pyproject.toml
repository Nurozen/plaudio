[project]
name = "plaudio"
version = "0.1.0"
description = "Talk to a Plaud Note Pro voice recorder over Bluetooth LE: list, download, decrypt, and live-stream recordings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Nurozen" }]
keywords = ["plaud", "note-pro", "bluetooth", "ble", "voice-recorder", "opus", "bleak"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=0.22",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/Nurozen/plaudio"
Repository = "https://github.com/Nurozen/plaudio"

[project.scripts]
plaudio = "plaudio.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
